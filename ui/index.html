<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self';"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXION</title>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">◆</span>
        <span class="brand-name">AXION</span>
      </div>
      <button
        id="settings-button"
        class="icon-button"
        title="Settings"
        aria-label="Open settings"
        data-i18n-title="header.settings.title"
        data-i18n-aria-label="header.settings.ariaLabel"
      >
        ⚙️
      </button>
    </header>

    <main class="app-main">
      <section class="workspace">
        <div class="image-panels">
          <div class="image-panel" id="original-panel">
            <div class="image-panel-header">
              <div class="image-panel-label" data-i18n="panel.original">Original</div>
              <button
                id="add-image-button"
                class="icon-button"
                title="Add image"
                aria-label="Add or replace the original image"
                data-i18n-title="panel.addImage.title"
                data-i18n-aria-label="panel.addImage.ariaLabel"
              >
                ➕
              </button>
            </div>
            <div id="dropzone" class="dropzone">
              <div class="dropzone-content">
                <div class="dropzone-icon">🖼️</div>
                <p class="dropzone-text" data-i18n="dropzone.dragDrop">Drag &amp; drop an image here</p>
                <button id="browse-button" class="secondary-button" data-i18n="dropzone.browse">Browse files…</button>
              </div>
              <img
                id="original-image"
                class="preview-image hidden"
                alt="Original image"
                data-i18n-alt="image.original.alt"
              />
            </div>
            <!--
              Extension point for a future multi-image gallery (thumbnails of recently
              imported images, click to switch the active original). Intentionally empty and
              hidden for now — see ARCHITECTURE.md's "Original panel gallery placeholder".
            -->
            <div
              id="original-gallery"
              class="image-gallery hidden"
              aria-label="Recent images"
              data-i18n-aria-label="gallery.ariaLabel"
            ></div>
          </div>

          <div class="image-panel" id="edited-panel">
            <div class="image-panel-header">
              <div class="image-panel-label" data-i18n="panel.edited">Edited</div>
              <div class="history-nav">
                <button
                  id="undo-button"
                  class="icon-button"
                  title="Undo"
                  aria-label="Undo"
                  disabled
                  data-i18n-title="button.undo.title"
                  data-i18n-aria-label="button.undo.ariaLabel"
                >
                  ↩️
                </button>
                <button
                  id="redo-button"
                  class="icon-button"
                  title="Redo"
                  aria-label="Redo"
                  disabled
                  data-i18n-title="button.redo.title"
                  data-i18n-aria-label="button.redo.ariaLabel"
                >
                  ↪️
                </button>
              </div>
            </div>
            <div class="edited-frame">
              <div id="edited-placeholder" class="edited-placeholder" data-i18n="edited.placeholder">
                Your edited image will appear here
              </div>
              <img
                id="edited-image"
                class="preview-image hidden"
                alt="Edited image"
                data-i18n-alt="image.edited.alt"
              />
            </div>
          </div>
        </div>

        <div class="prompt-panel">
          <div class="conversation-row">
            <label class="toggle">
              <input type="checkbox" id="conversation-mode-toggle" checked />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span class="toggle-label" data-i18n="conversationMode.label">Conversation Mode</span>
            </label>
            <button id="new-conversation-button" class="text-button" data-i18n="conversationMode.newButton">
              Start new conversation
            </button>
          </div>

          <div
            class="style-library"
            id="style-library"
            aria-label="Style library"
            data-i18n-aria-label="styleLibrary.ariaLabel"
          ></div>

          <div class="prompt-box">
            <textarea
              id="prompt-input"
              class="prompt-textarea"
              rows="3"
              placeholder="Describe the edit you want… e.g. &quot;Make this photo look cinematic&quot;"
              data-i18n-placeholder="prompt.placeholder"
            ></textarea>
            <button
              id="voice-button"
              class="icon-button voice-button"
              title="Voice command"
              aria-label="Voice command"
              data-i18n-title="voice.button.title"
              data-i18n-aria-label="voice.button.ariaLabel"
            >
              🎙️
            </button>
          </div>

          <div class="action-row">
            <button id="edit-image-button" class="primary-button" data-i18n="button.editImage">Edit Image</button>
            <button id="copy-image-button" class="secondary-button" disabled data-i18n="button.copyImage">
              Copy Image
            </button>
            <button id="save-image-button" class="secondary-button" disabled data-i18n="button.saveImage">
              💾 Save Image
            </button>
          </div>

          <div class="progress-bar" id="progress-bar">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
          </div>

          <div class="status-bar" id="status-bar" data-i18n="status.ready">Ready. Drop an image to get started.</div>
        </div>
      </section>

      <aside class="sidebar">
        <section class="sidebar-section">
          <h2 class="sidebar-title" data-i18n="sidebar.templates">Templates</h2>
          <ul id="templates-list" class="template-list"></ul>
        </section>

        <section class="sidebar-section sidebar-section-grow">
          <div class="sidebar-title-row">
            <h2 class="sidebar-title" data-i18n="sidebar.history">History</h2>
            <button id="clear-history-button" class="text-button" data-i18n="history.clear">Clear</button>
          </div>
          <ul id="history-list" class="history-list"></ul>
        </section>
      </aside>
    </main>
  </div>

  <div id="image-preview-modal" class="modal-overlay image-preview-overlay hidden">
    <div class="image-preview-modal" role="dialog" aria-modal="true" aria-labelledby="image-preview-title">
      <div class="image-preview-toolbar">
        <h2 id="image-preview-title" data-i18n="preview.title">Image preview</h2>
        <div class="image-preview-actions">
          <div class="image-preview-switcher" role="group" aria-label="Choose image" data-i18n-aria-label="preview.chooseImage">
            <button id="preview-original-button" class="secondary-button" data-i18n="panel.original">Original</button>
            <button id="preview-edited-button" class="secondary-button" data-i18n="panel.edited">Edited</button>
          </div>
          <button
            id="close-image-preview-button"
            class="icon-button"
            aria-label="Close image preview"
            data-i18n-aria-label="preview.close.ariaLabel"
          >
            ✕
          </button>
        </div>
      </div>
      <div class="image-preview-stage">
        <button
          id="preview-previous-button"
          class="icon-button image-preview-nav image-preview-nav-previous"
          aria-label="Show original image"
          data-i18n-aria-label="preview.original.ariaLabel"
        >
          ←
        </button>
        <img id="image-preview-full" alt="Enlarged image" data-i18n-alt="preview.image.alt" />
        <button
          id="preview-next-button"
          class="icon-button image-preview-nav image-preview-nav-next"
          aria-label="Show edited image"
          data-i18n-aria-label="preview.edited.ariaLabel"
        >
          →
        </button>
      </div>
      <p class="image-preview-hint" data-i18n="preview.hint">Use ← and → to compare · Esc to close</p>
    </div>
  </div>

  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-labelledby="settings-title">
      <div class="modal-header">
        <h2 id="settings-title" data-i18n="settings.title">Settings</h2>
        <button
          id="close-settings-button"
          class="icon-button"
          aria-label="Close settings"
          data-i18n-aria-label="settings.close.ariaLabel"
        >
          ✕
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="api-key-input" data-i18n="settings.apiKey.label">Access key</label>
        <div class="api-key-row">
          <div class="api-key-input-wrap">
            <input
              id="api-key-input"
              class="text-input"
              type="password"
              placeholder="Enter your access key"
              autocomplete="off"
              spellcheck="false"
              data-i18n-placeholder="settings.apiKey.placeholder"
            />
            <button
              id="toggle-key-visibility-button"
              type="button"
              class="icon-button api-key-inline-button"
              title="Show key"
              aria-label="Show key"
            >
              👁
            </button>
          </div>
          <button
            id="paste-api-key-button"
            type="button"
            class="icon-button"
            title="Paste from clipboard"
            aria-label="Paste key from clipboard"
            data-i18n-title="settings.apiKey.paste.title"
            data-i18n-aria-label="settings.apiKey.paste.ariaLabel"
          >
            📋
          </button>
          <button id="save-api-key-button" class="secondary-button" data-i18n="settings.apiKey.save">Save</button>
        </div>
        <p id="api-key-status" class="field-hint">No key configured yet.</p>

        <div class="settings-divider"></div>

        <label class="field-label" for="language-select" data-i18n="settings.language.label">Language</label>
        <select id="language-select" class="text-input">
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>

      </div>
    </div>
  </div>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>
